name: amlogic-delta
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone both
        run: |
          git clone https://github.com/Toysoft/enigma2-amlogic.git fork
          git clone https://github.com/OpenPLi/enigma2.git upstream
      - name: Fork info
        run: |
          cd fork
          git log -1 --format='%h %cd %s'
          git rev-list --count HEAD
          grep -rIl -i amlogic . --exclude-dir=.git | head -60 || true
      - name: Python and configure
        run: |
          grep -n -i "python" fork/configure.ac | head -15 || true
          grep -n "AMLOGIC" fork/configure.ac | head -10 || true
      - name: Delta vs upstream
        run: |
          cd fork
          git remote add up ../upstream
          git fetch up --quiet || true
          B=$(git merge-base HEAD up/master || true)
          echo "base: $B"
          git diff --shortstat $B HEAD || true
          git diff --stat=100 $B HEAD | sort -t'|' -k2 -nr | head -30 || true
