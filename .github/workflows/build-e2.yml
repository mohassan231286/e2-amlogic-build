name: build-e2
on: workflow_dispatch
defaults:
  run:
    shell: bash {0}
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    steps:
      - name: Host tools and package lists
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkgconf zstd xz-utils binutils autoconf automake libtool gettext autopoint autoconf-archive patch git python3
          mkdir out
          B=https://feeds2.mynonpublic.com/8.0.1/dreamone
          for d in aarch64 all dreamone; do
            curl -sS -L -f -o $d.gz $B/$d/Packages.gz && zcat $d.gz > $d.txt
          done
          ls -la *.txt
      - name: Resolver script
        run: |
          cat > mksysroot.py <<'PYEOF'
          import os, sys, subprocess, tempfile, urllib.parse, urllib.request
          import concurrent.futures as cf

          BASE = "https://feeds2.mynonpublic.com/8.0.1/dreamone"
          ROOT = os.path.abspath(sys.argv[1])
          WANT = sys.argv[2:]
          DRY = os.environ.get("DRYRUN") == "1"

          def parse(path, feed):
              pk, cur, last = {}, {}, None
              def flush():
                  if cur.get("Package"):
                      d = dict(cur)
                      d["_feed"] = feed
                      pk.setdefault(d["Package"], d)
              for line in open(path, encoding="utf-8", errors="replace"):
                  line = line.rstrip("\n")
                  if not line.strip():
                      flush()
                      cur.clear()
                      last = None
                      continue
                  if line[0] in " \t" and last:
                      cur[last] += " " + line.strip()
                      continue
                  k, _, v = line.partition(":")
                  cur[k] = v.strip()
                  last = k
              flush()
              return pk

          allp = {}
          for feed in ("aarch64", "all", "dreamone"):
              for n, p in parse(feed + ".txt", feed).items():
                  allp.setdefault(n, p)

          provides = {}
          for n, p in allp.items():
              for tok in p.get("Provides", "").split(","):
                  t = tok.strip().split(" ")[0]
                  if t and t not in allp:
                      provides.setdefault(t, n)

          def resolve(name):
              if name in allp:
                  return name
              return provides.get(name)

          need, order, missing = set(), [], []
          stack = list(WANT)
          while stack:
              n = stack.pop()
              r = resolve(n)
              if r is None:
                  missing.append(n)
                  continue
              if r in need:
                  continue
              need.add(r)
              order.append(r)
              for tok in allp[r].get("Depends", "").split(","):
                  tok = tok.strip()
                  if not tok:
                      continue
                  alts = [a.strip().split(" ")[0] for a in tok.split("|")]
                  pick = next((a for a in alts if resolve(a)), alts[0])
                  stack.append(pick)

          os.makedirs("out", exist_ok=True)
          open("out/closure.txt", "w").write("\n".join(sorted(need)) + "\n")
          open("out/missing.txt", "w").write("\n".join(sorted(set(missing))) + "\n")
          print("packages in closure:", len(need), " missing:", len(set(missing)), flush=True)
          if DRY:
              sys.exit(0)

          os.makedirs("ipk", exist_ok=True)
          os.makedirs(ROOT, exist_ok=True)

          def get(n):
              p = allp[n]
              fn = p["Filename"]
              dst = os.path.join("ipk", os.path.basename(fn))
              if os.path.exists(dst) and os.path.getsize(dst) > 0:
                  return n, dst, None
              url = BASE + "/" + p["_feed"] + "/" + urllib.parse.quote(fn, safe="/+")
              err = None
              for _ in range(3):
                  try:
                      urllib.request.urlretrieve(url, dst)
                      return n, dst, None
                  except Exception as e:
                      err = str(e)
              return n, dst, err

          def extract(path):
              tmp = tempfile.mkdtemp()
              with open(path, "rb") as f:
                  magic = f.read(8)
              if magic.startswith(b"!<arch>"):
                  subprocess.run(["ar", "x", os.path.abspath(path)], cwd=tmp, check=True)
              else:
                  subprocess.run(["tar", "-xf", os.path.abspath(path), "-C", tmp], check=True)
              data = [x for x in os.listdir(tmp) if x.startswith("data.tar")]
              if not data:
                  raise RuntimeError("no data.tar in " + path)
              subprocess.run(["tar", "-xf", os.path.join(tmp, data[0]), "-C", ROOT,
                              "--keep-directory-symlink"], check=True)

          failed = []
          with cf.ThreadPoolExecutor(8) as ex:
              results = list(ex.map(get, sorted(need)))
          for n, dst, err in results:
              if err:
                  failed.append("download " + n + ": " + err)
                  continue
              try:
                  extract(dst)
              except Exception as e:
                  failed.append("extract " + n + ": " + str(e))
          open("out/failed.txt", "w").write("\n".join(failed) + "\n")
          print("done. failed:", len(failed), flush=True)
          PYEOF
          python3 -m py_compile mksysroot.py && echo script-ok
      - name: Fetch and patch enigma2 source
        run: |
          git clone --depth 1 https://github.com/oe-alliance/oe-alliance-core.git oac
          git clone --branch 8.0 --single-branch https://github.com/openatv/enigma2.git src
          cd src
          git checkout -q 3bbdfa38e0
          git log -1 --format='%h %cd %s' | tee ../out/e2-version.txt
          patch -p1 --no-backup-if-mismatch -i ../oac/meta-oe/recipes-oe-alliance/enigma2/enigma2/openatv/swig-4.3.patch 2>&1 | tee ../out/patch.log
          sed -i "s/sigc++-2.0/sigc++-3.0/g" configure.ac enigma2.pc.in
          autoreconf -v --install --force 2>&1 | tee ../out/autoreconf.log | tail -15
          ls -la configure Makefile.in
      - name: Build sysroot from feed
        run: |
          sudo python3 mksysroot.py "$PWD/root" gcc g++ gcc-symlinks g++-symlinks cpp cpp-symlinks binutils make libtool swig gettext gettext-dev coreutils gawk findutils diffutils tar bzip2 xz busybox bash python3-core python3-dev python3-six libc6-dev libstdc++-dev libgcc-s-dev libatomic-dev libgomp-dev linux-libc-headers-dev libsigc-3.0-dev gstreamer1.0-dev gstreamer1.0-plugins-base-dev libfreetype-dev libfribidi-dev libdvbsi++-dev libdvbcsa-dev openssl-dev libpng16-dev libjpeg-dev libgif-dev libxml2-dev libz-dev libbluray-dev libdreamdvd-dev libudfread-dev libtuxtxt-dev libtuxtxt32bpp-dev libmad-dev libxmlccwrap-dev ffmpeg-dev libasound-dev libwebp-dev curl-dev libglib-2.0-dev libcrypt-dev avahi-dev 2>&1 | tee out/mksysroot.log
