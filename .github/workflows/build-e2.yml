name: build-e2
on: workflow_dispatch
permissions:
  contents: write
defaults:
  run:
    shell: bash {0}
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    steps:
      - name: Host tools and package lists
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkgconf zstd xz-utils binutils autoconf automake libtool gettext autopoint autoconf-archive patch git python3
          mkdir out
          B=https://feeds2.mynonpublic.com/8.0.1/dreamone
          for d in aarch64 all dreamone; do
            curl -sS -L -f -o $d.gz $B/$d/Packages.gz && zcat $d.gz > $d.txt
          done
          ls -la *.txt
      - name: Resolver script
        run: |
          cat > mksysroot.py <<'PYEOF'
          import os, sys, subprocess, tempfile, urllib.parse, urllib.request
          import concurrent.futures as cf

          BASE = "https://feeds2.mynonpublic.com/8.0.1/dreamone"
          ROOT = os.path.abspath(sys.argv[1])
          WANT = sys.argv[2:]
          DRY = os.environ.get("DRYRUN") == "1"

          def parse(path, feed):
              pk, cur, last = {}, {}, None
              def flush():
                  if cur.get("Package"):
                      d = dict(cur)
                      d["_feed"] = feed
                      pk.setdefault(d["Package"], d)
              for line in open(path, encoding="utf-8", errors="replace"):
                  line = line.rstrip("\n")
                  if not line.strip():
                      flush()
                      cur.clear()
                      last = None
                      continue
                  if line[0] in " \t" and last:
                      cur[last] += " " + line.strip()
                      continue
                  k, _, v = line.partition(":")
                  cur[k] = v.strip()
                  last = k
              flush()
              return pk

          allp = {}
          for feed in ("aarch64", "all", "dreamone"):
              for n, p in parse(feed + ".txt", feed).items():
                  allp.setdefault(n, p)

          provides = {}
          for n, p in allp.items():
              for tok in p.get("Provides", "").split(","):
                  t = tok.strip().split(" ")[0]
                  if t and t not in allp:
                      provides.setdefault(t, n)

          def resolve(name):
              if name in allp:
                  return name
              return provides.get(name)

          need, order, missing = set(), [], []
          stack = list(WANT)
          while stack:
              n = stack.pop()
              r = resolve(n)
              if r is None:
                  missing.append(n)
                  continue
              if r in need:
                  continue
              need.add(r)
              order.append(r)
              for tok in allp[r].get("Depends", "").split(","):
                  tok = tok.strip()
                  if not tok:
                      continue
                  alts = [a.strip().split(" ")[0] for a in tok.split("|")]
                  pick = next((a for a in alts if resolve(a)), alts[0])
                  stack.append(pick)

          os.makedirs("out", exist_ok=True)
          open("out/closure.txt", "w").write("\n".join(sorted(need)) + "\n")
          open("out/missing.txt", "w").write("\n".join(sorted(set(missing))) + "\n")
          print("packages in closure:", len(need), " missing:", len(set(missing)), flush=True)
          if DRY:
              sys.exit(0)

          os.makedirs("ipk", exist_ok=True)
          os.makedirs(ROOT, exist_ok=True)

          def get(n):
              p = allp[n]
              fn = p["Filename"]
              dst = os.path.join("ipk", os.path.basename(fn))
              if os.path.exists(dst) and os.path.getsize(dst) > 0:
                  return n, dst, None
              url = BASE + "/" + p["_feed"] + "/" + urllib.parse.quote(fn, safe="/+")
              err = None
              for _ in range(3):
                  try:
                      urllib.request.urlretrieve(url, dst)
                      return n, dst, None
                  except Exception as e:
                      err = str(e)
              return n, dst, err

          def extract(path):
              tmp = tempfile.mkdtemp()
              with open(path, "rb") as f:
                  magic = f.read(8)
              if magic.startswith(b"!<arch>"):
                  subprocess.run(["ar", "x", os.path.abspath(path)], cwd=tmp, check=True)
              else:
                  subprocess.run(["tar", "-xf", os.path.abspath(path), "-C", tmp], check=True)
              data = [x for x in os.listdir(tmp) if x.startswith("data.tar")]
              if not data:
                  raise RuntimeError("no data.tar in " + path)
              subprocess.run(["tar", "-xf", os.path.join(tmp, data[0]), "-C", ROOT,
                              "--keep-directory-symlink"], check=True)

          failed = []
          with cf.ThreadPoolExecutor(8) as ex:
              results = list(ex.map(get, sorted(need)))
          for n, dst, err in results:
              if err:
                  failed.append("download " + n + ": " + err)
                  continue
              try:
                  extract(dst)
              except Exception as e:
                  failed.append("extract " + n + ": " + str(e))
          open("out/failed.txt", "w").write("\n".join(failed) + "\n")
          print("done. failed:", len(failed), flush=True)
          PYEOF
          python3 -m py_compile mksysroot.py && echo script-ok
      - name: Fetch and patch enigma2 source
        run: |
          git clone --depth 1 https://github.com/oe-alliance/oe-alliance-core.git oac
          git clone --branch 8.0 --single-branch https://github.com/openatv/enigma2.git src
          cd src
          git checkout -q 3bbdfa38e0
          git log -1 --format='%h %cd %s' | tee ../out/e2-version.txt
          patch -p1 --no-backup-if-mismatch -i ../oac/meta-oe/recipes-oe-alliance/enigma2/enigma2/openatv/swig-4.3.patch 2>&1 | tee ../out/patch.log
          sed -i "s/sigc++-2.0/sigc++-3.0/g" configure.ac enigma2.pc.in
          curl -sL "https://raw.githubusercontent.com/Toysoft/enigma2-amlogic/01c58b03e7b7bef6da6b5c53a994df97ac4a7d07/lib/dvb/amldecoder.cpp" -o lib/dvb/amldecoder.cpp
          curl -sL "https://raw.githubusercontent.com/Toysoft/enigma2-amlogic/01c58b03e7b7bef6da6b5c53a994df97ac4a7d07/lib/dvb/amldecoder.h" -o lib/dvb/amldecoder.h
          echo "" >> lib/dvb/Makefile.inc
          echo "if HAVE_AMLOGIC" >> lib/dvb/Makefile.inc
          echo "dvb_libenigma_dvb_a_SOURCES += dvb/amldecoder.cpp" >> lib/dvb/Makefile.inc
          echo "endif" >> lib/dvb/Makefile.inc
          sed -i '/AC_DEFINE_UNQUOTED(LCD_DEV/a AC_ARG_WITH(amlogic, AC_HELP_STRING([--with-amlogic], [use amlogic MPEG decoder]), [[with_amlogic=$withval]], [[with_amlogic=no]])\nAM_CONDITIONAL(HAVE_AMLOGIC, test x"$with_amlogic" = xyes)\nif test x"$with_amlogic" = xyes ; then\n  AC_DEFINE(HAVE_AMLOGIC, 1, [Enables AMLOGIC decoder support])\nfi' configure.ac
          autoreconf -v --install --force 2>&1 | tee ../out/autoreconf.log | tail -15
          ls -la configure Makefile.in
      - name: Build sysroot from feed
        run: |
          sudo python3 mksysroot.py "$PWD/root" gcc g++ gcc-symlinks g++-symlinks cpp cpp-symlinks binutils make libtool swig gettext gettext-dev coreutils gawk findutils diffutils tar bzip2 xz busybox bash python3-core python3-modules python3-dev python3-six libc6-dev libstdc++-dev libgcc-s-dev libatomic-dev libgomp-dev linux-libc-headers-dev libsigc-3.0-dev gstreamer1.0-dev gstreamer1.0-plugins-base-dev libfreetype-dev libfribidi-dev libdvbsi++-dev libdvbcsa-dev openssl-dev libpng16-dev libjpeg-dev libgif-dev libxml2-dev libz-dev libbluray-dev libdreamdvd-dev libudfread-dev libtuxtxt-dev libtuxtxt32bpp-dev libmad-dev libxmlccwrap-dev ffmpeg-dev libasound-dev libwebp-dev curl-dev libglib-2.0-dev libcrypt-dev avahi-dev 2>&1 | tee out/mksysroot.log
          du -sh root | tee -a out/mksysroot.log
          sudo chroot "$PWD/root" /usr/bin/python3 -c "import sys,os,linecache,sysconfig;print(sys.prefix);print(sys.path)" 2>&1 | tee out/python-test.log
      - name: Prepare chroot
        run: |
          R=$PWD/root
          sudo mkdir -p $R/proc $R/dev $R/sys $R/tmp $R/etc $R/build $R/out
          sudo chmod 1777 $R/tmp
          sudo mount -t proc proc $R/proc
          sudo mount --bind /dev $R/dev
          sudo cp /etc/resolv.conf $R/etc/resolv.conf
          BBP=/bin/busybox.nosuid
          [ -e $R$BBP ] || BBP=/bin/busybox
          LINKS=$R/etc/busybox.links.nosuid
          [ -e $LINKS ] || LINKS=$R/etc/busybox.links
          echo "busybox=$BBP links=$LINKS" | tee out/prepare.log
          if [ -e $LINKS ]; then
            while read -r l; do
              [ -z "$l" ] && continue
              if [ ! -e "$R$l" ] && [ ! -L "$R$l" ]; then
                sudo mkdir -p "$R$(dirname $l)"
                sudo ln -s $BBP "$R$l"
              fi
            done < $LINKS
          else
            for a in sh ash sed grep head tail awk tr cut sort uniq find xargs cp mv rm ln mkdir rmdir chmod chown cat echo expr test true false sleep date dirname basename readlink touch tee wc diff env uname id tar gzip gunzip bzip2 which ls pwd printf sync; do
              [ -e $R/bin/$a ] || sudo ln -s $BBP $R/bin/$a
            done
          fi
          [ -e $R/bin/sh ] || sudo ln -s $(basename $BBP) $R/bin/sh
          [ -e $R/bin/bash ] || [ ! -e $R/bin/bash.bash ] || sudo ln -s bash.bash $R/bin/bash
          for t in ld ar as nm ranlib strip objcopy objdump readelf strings size addr2line c++filt; do
            if [ -e $R/usr/bin/aarch64-oe-linux-$t ]; then sudo ln -sf aarch64-oe-linux-$t $R/usr/bin/$t; fi
          done
          for pair in cc:gcc c++:g++ cpp:cpp; do
            n=${pair%%:*}; t=${pair##*:}
            if [ ! -e $R/usr/bin/$n ] && [ -e $R/usr/bin/aarch64-oe-linux-$t ]; then sudo ln -s aarch64-oe-linux-$t $R/usr/bin/$n; fi
          done
          sudo cp -a /usr/bin/pkgconf $R/usr/bin/
          sudo ln -sf pkgconf $R/usr/bin/pkg-config
          sudo cp -a /usr/lib/aarch64-linux-gnu/libpkgconf.so.* $R/usr/lib/
          for t in sh sed grep awk head make gcc g++ ld ar as strings python3 swig msgfmt pkg-config install; do
            for d in usr/bin bin usr/sbin sbin; do
              if [ -e $R/$d/$t ] || [ -L $R/$d/$t ]; then echo "$t: /$d/$t -> $(readlink $R/$d/$t)"; break; fi
            done
          done 2>&1 | tee -a out/prepare.log
      - name: Configure enigma2
        run: |
          R=$PWD/root
          tar --exclude=.git -cf - src | sudo tar -xf - -C $R/build
          sudo tee $R/build/cfg.sh > /dev/null <<'CFGEOF'
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig
          export CPPFLAGS="-Wno-error=format-security"
          export LDFLAGS="-lxml2"
          cd /build/src
          ./configure --prefix=/usr --exec_prefix=/usr --bindir=/usr/bin --sbindir=/usr/sbin --libexecdir=/usr/libexec --datadir=/usr/share --sysconfdir=/etc --sharedstatedir=/com --localstatedir=/var --libdir=/usr/lib --includedir=/usr/include --oldincludedir=/usr/include --infodir=/usr/share/info --mandir=/usr/share/man --disable-silent-rules --enable-dependency-tracking BUILD_SYS=aarch64-linux HOST_SYS=aarch64-oe-linux STAGING_INCDIR=/usr/include STAGING_LIBDIR=/usr/lib --with-boxtype=generic --with-machinebuild=generic --with-libsdl=no --with-gstversion=1.0 --with-e2rev=35806+3bbdfa38e0 --with-oarev=unknown --with-alsa --with-alsacard=hw:0 --with-alsamixer=Master --with-fbdev=/dev/fb0 --with-lcddev=/dev/null --with-amlogic
          CFGEOF
          sudo chroot $R /bin/sh /build/cfg.sh > out/configure.log 2>&1
          echo "configure exit: $?" | tee -a out/configure.log
          tail -25 out/configure.log
          sudo cp $R/build/src/config.log out/config.log 2>/dev/null
          [ -f $R/build/src/Makefile ] && echo MAKEFILE-OK
      - name: Compile and install
        run: |
          R=$PWD/root
          if [ ! -f $R/build/src/Makefile ]; then echo "no Makefile, skipping"; exit 1; fi
          sudo tee $R/build/make.sh > /dev/null <<'MKEOF'
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig
          cd /build/src
          make -k -j4 V=1 || { cat make.log | grep -A 5 -B 5 "error:"; exit 1; }
          MKEOF
          sudo chroot $R /bin/sh /build/make.sh > make.log 2>&1
          RC=$?
          echo "make exit: $RC" | tee out/make-exit.txt
          grep -n -E "error:|Error [0-9]|undefined reference|No such file|not found" make.log | head -80 > out/make-errors.txt
          tail -60 make.log > out/make-tail.log
          gzip -c make.log > out/make.log.gz
          sudo chroot $R /usr/bin/strip --strip-unneeded /out/usr/bin/enigma2
          ls -la $R/out/usr/bin 2>/dev/null | tee -a out/make-exit.txt
          sudo chroot $R /usr/bin/readelf -d /out/usr/bin/enigma2 2>/dev/null | grep NEEDED > out/enigma2-needed.txt
          W=$PWD
          mkdir -p install
          sudo tar czf $W/install/enigma2-install.tar.gz -C $R/out .
          FILES="usr/bin/enigma2"
          [ -f $R/out/usr/lib/enigma2/python/enigma.py ] && FILES="$FILES usr/lib/enigma2/python/enigma.py"
          sudo tar czf $W/install/enigma2-bin.tar.gz -C $R/out $FILES
          ls -la install | tee -a out/make-exit.txt
          exit $RC
      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest -R $GITHUB_REPOSITORY > /dev/null 2>&1 || gh release create latest -R $GITHUB_REPOSITORY --title "latest build" --notes "automated enigma2 build"
          gh release upload latest -R $GITHUB_REPOSITORY install/enigma2-bin.tar.gz install/enigma2-install.tar.gz --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-install
          path: install
