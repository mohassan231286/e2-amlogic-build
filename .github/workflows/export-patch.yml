name: export-patch
on: workflow_dispatch
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone
        run: git clone https://github.com/Toysoft/enigma2-amlogic.git fork
      - name: Make bundle
        run: |
          mkdir out
          cd fork
          git show 64f2f30f0 > ../out/removal-commit.patch
          git show 64f2f30f0~1:lib/dvb/amldecoder.cpp > ../out/amldecoder.cpp
          git show 64f2f30f0~1:lib/dvb/amldecoder.h > ../out/amldecoder.h
          git log --format='%h %ad %s' --date=short -- lib/dvb/amldecoder.cpp > ../out/amldecoder-history.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: amlogic-code
          path: out
