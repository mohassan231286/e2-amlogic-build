name: find-headers
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone libp
        run: |
          export GIT_TERMINAL_PROMPT=0
          git clone --depth 1 https://github.com/vitmod/libp.git libp || echo "clone failed"
          cd libp 2>/dev/null && git log -1 --format='%h %cd %s' && ls || true
      - name: Find headers
        run: |
          cd libp 2>/dev/null || exit 0
          find . \( -name codec.h -o -name codec_type.h -o -name codec_error.h -o -name adec-external-ctrl.h \) | head -30
          grep -rIn "audio_decode_init" --include=*.h . | head -10 || true
          grep -rIn "codec_get_vbuf_state" --include=*.h . | head -10 || true
